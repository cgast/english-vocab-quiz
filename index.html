<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vokabeltrainer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Vokabeltrainer</h1>
    <p class="site-subtitle">Vokabeln lernen und testen — mit Kontext statt reiner Übersetzung</p>
    <nav class="main-nav">
      <button type="button" data-nav="vocab" class="active">Vokabeln</button>
      <button type="button" data-nav="quiz">Test</button>
      <button type="button" data-nav="game">Spiel</button>
      <button type="button" data-nav="settings">Einstellungen</button>
    </nav>
  </header>

  <main class="site-main">
    <section id="view-vocab"></section>
    <section id="view-quiz" hidden></section>
    <section id="view-game" hidden></section>
    <section id="view-settings" hidden></section>
  </main>

  <footer class="site-footer">
    <p>Alle Daten bleiben lokal in diesem Browser gespeichert.</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
